# One line per day. The lens is what the learner should notice today; it is not a lesson.
0: "Before anything: three unaided tasks, so we know where you start."
1: "Notice one task you were going to do yourself that an agent should own."
2: "Notice a procedure you repeat every week. Where do you make decisions inside it?"
3: "Notice where your agent can only talk. What would it need to be able to act?"
4: "Notice a piece of work with more than four steps. Which step would you never trust unchecked?"
5: "Notice the first claim in anything AI-written today. Is it supported?"
6: "Notice what an agent could send, spend or delete on your behalf. Who decided that limit?"
7: "Notice a decision you are postponing because you want more information you won't get."
8: "Notice a moment when a team needs direction before the plan exists."
9: "Notice one constraint today that is actually an opening."
10: "Notice the moment when the efficient answer is the wrong one."
11: "Notice what the last AI output did not consider."
12: "Notice what you do in the first minute after something breaks."
13: "The Incident is today. Clear twenty minutes."
14: "Look back. What will you keep doing without this campaign?"
